services:

  # Caddy edge: termina TLS (Let's Encrypt auto) si face reverse-proxy catre
  # containerul `frontend`. Singurul serviciu care publica porturi catre host.
  caddy:
    image: caddy:2-alpine
    container_name: berlinstar_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    labels:
      autoheal: "true"

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        - VITE_BASE_PATH=${VITE_BASE_PATH:-/berlinstar/}
    # Nu mai publica port catre host — Caddy ajunge la el ca `frontend:80`
    # pe reteaua interna `web`.
    expose:
      - "80"
    networks:
      - web
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    labels:
      # autoheal monitor: cand healthcheck devine "unhealthy" `retries` ori la
      # rand, containerul autoheal restarteaza serviciul. `unless-stopped`
      # SINGUR nu acopera cazul asta — el restarteaza doar la exit non-zero,
      # nu si cand procesul ramane "in viata" dar healthcheck-ul cade.
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - .env
    networks:
      - web
      - internal
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      autoheal: "true"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=3).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Portul 5432 NU este publicat catre host (B-05).
    # Pentru acces ad-hoc: `docker compose exec db psql -U $POSTGRES_USER`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    labels:
      autoheal: "true"
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c random_page_cost=1.1
      -c max_wal_size=2GB
      -c min_wal_size=512MB
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 8G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Watcher care monitorizeaza event-urile Docker si restarteaza orice container
  # care a fost marcat (label `autoheal: "true"`) si a intrat in "unhealthy".
  # Acopera scenariile in care procesul ramane in viata dar nu mai raspunde la
  # /api/health, wget pe /, sau pg_isready — adica fix cazurile in care
  # `restart: unless-stopped` SINGUR nu salveaza stack-ul.
  #
  # Sursa: https://github.com/willfarrell/docker-autoheal
  # Tag-ul este pinned (nu :latest) ca sa avem build reproductibil.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: berlinstar_autoheal
    restart: unless-stopped
    environment:
      # Monitorizam doar containerele cu label autoheal=true (in loc de all),
      # ca sa nu atinga containere managed by other stacks daca daemonul e shared.
      AUTOHEAL_CONTAINER_LABEL: autoheal
      # Asteptam putin dupa pornire inainte de a evalua healthcheck-urile, ca
      # sa nu se ia in considerare prima "starting" → "unhealthy".
      AUTOHEAL_START_PERIOD: "10"
      # Cat asteptam intre restart-uri consecutive ale aceluiasi container,
      # pentru a evita restart loop-uri prea agresive.
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "10"
      AUTOHEAL_INTERVAL: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  web:
  internal:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
