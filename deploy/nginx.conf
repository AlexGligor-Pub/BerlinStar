upstream backend_pool {
    ip_hash;
    server backend:8000;
    keepalive 64;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Proxy /api/ catre backend (direct, fara prefix)
    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Proxy /berlinstar/api/ catre backend (acces direct local, fara reverse proxy)
    location /berlinstar/api/ {
        rewrite ^/berlinstar(/api/.*)$ $1 break;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Nu cache HTML (altfel browserul serveste index.html vechi cu hash-uri vechi)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache agresiv pentru assets statice
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Handle /berlinstar/ prefix (for direct port access without reverse proxy stripping)
    location /berlinstar/ {
        alias /usr/share/nginx/html/;
        try_files $uri /index.html;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
