server {
    listen 80;
    root /usr/share/nginx/html;

    # Redirect /berlinstar → /berlinstar/
    location = /berlinstar {
        return 301 /berlinstar/;
    }

    # Proxy /berlinstar/api/ catre backend (strip prefix)
    location /berlinstar/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA la /berlinstar/
    location /berlinstar/ {
        try_files $uri $uri/ /berlinstar/index.html;
    }
}
