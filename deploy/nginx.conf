server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cache agresiv pentru assets statice (hash în filename — safe to cache forever)
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback — toate rutele necunoscute → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
