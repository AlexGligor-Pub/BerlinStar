server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api catre backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE support (receipts/events)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Health check pentru /health (fara prefix /api)
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Cache agresiv pentru assets statice (hash în filename — safe to cache forever)
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback — toate rutele necunoscute → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
