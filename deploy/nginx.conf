upstream backend_pool {
    server backend:8000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# CSP per-sectiune:
#   - marketing (default): permite Google Fonts, embed YouTube, inline scripts
#   - aplicatie (/berlinstar...): politica stricta (script-src 'self')
map $uri $csp {
    default     "default-src 'self'; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; frame-src https://www.youtube-nocookie.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
    ~^/berlinstar "default-src 'self'; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    keepalive_timeout 65;
    keepalive_requests 1000;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/x-javascript
               application/json application/xml application/xml+rss
               application/atom+xml image/svg+xml font/ttf font/otf
               application/font-woff application/font-woff2;

    # Security headers la edge (CSP variaza per sectiune via $csp).
    # ATENTIE: nu folosi `add_header` in location-urile de mai jos — in nginx,
    # orice add_header intr-un location anuleaza COMPLET cele mostenite de aici.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy $csp always;
    # Activeaza HSTS cand TLS este terminat la edge:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Import legacy: dump-uri SSMS pot ajunge la ~200MB + import dureaza 30-60s
    # → relaxam body size si timeout-ul DOAR pentru acest endpoint.
    location = /api/admin/legacy-import/import {
        client_max_body_size 500m;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /berlinstar/api/admin/legacy-import/import {
        rewrite ^/berlinstar(/api/.*)$ $1 break;
        client_max_body_size 500m;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SSE: timeout lung pentru receipts events (numai pe acest path)
    location = /api/receipts/events {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /berlinstar/api/receipts/events {
        rewrite ^/berlinstar(/api/.*)$ $1 break;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SSE Asistent AI: chat_id dinamic => regex; fara buffering, timeout lung.
    location ~ ^/api/admin/assistant/chats/[^/]+/events$ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location ~ ^/berlinstar/api/admin/assistant/chats/[^/]+/events$ {
        rewrite ^/berlinstar(/api/.*)$ $1 break;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # /api/ standard: timeout 60s
    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # /berlinstar/api/ standard: timeout 60s
    location /berlinstar/api/ {
        rewrite ^/berlinstar(/api/.*)$ $1 break;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Nu cache HTML (fara add_header — vezi nota de la security headers).
    location ~* \.html$ {
        expires -1;
    }

    # Cache agresiv pentru assets statice (fara add_header — vezi nota de mai sus).
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        access_log off;
    }

    # Aplicatia SolidJS la /berlinstar/ (dist copiat in subdir-ul berlinstar/)
    location /berlinstar/ {
        try_files $uri $uri/ /berlinstar/index.html;
    }

    # Site de marketing static la root (multi-pagina, fara fallback SPA)
    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }
}
